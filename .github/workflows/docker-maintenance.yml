# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# Every Dependabot PR reaches the reusable module - base images in
# src/*/Dockerfile, image references in docker-compose*.yml and any ecosystem
# added later - so each one gets an explicit decision (annotation and job
# summary) instead of silently staying open. The module merges only after
# every workflow in required-workflows passed on the PR; that input is unset
# here (see below), so every PR is left open for a manual merge. GitHub
# Actions updates and other .github/ changes always stay manual.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    # No paths filter: the module itself skips PRs not opened by Dependabot.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # required-workflows is deliberately not set, so nothing is merged
      # automatically: no PR workflow builds the images (release.yml only
      # validates the compose files and shell scripts), so an update would
      # be merged untested. Set it once a PR workflow builds src/*/Dockerfile.
    secrets: inherit
